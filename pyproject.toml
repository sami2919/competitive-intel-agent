[project]
name = "competitive-intel-agent"
version = "0.1.0"
description = "Competitive marketing intelligence agent — single orchestrator, deterministic gates, auditable claims ledger."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["evals"]
