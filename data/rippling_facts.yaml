# --- Verification checklist before any live demo -----------------------------
# 1. Open rippling.com, fill source_url for each fact you intend to use.
# 2. Flip verified: true ONLY where the URL genuinely establishes the statement.
# 3. Delete any fact you cannot source. A shorter verified list beats a longer
#    aspirational one — same principle as the confidence gate.
# 4. Re-run: make cro PAGE=... and confirm no shipped variant cites an unverified id.
