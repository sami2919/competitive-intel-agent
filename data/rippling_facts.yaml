# First-party claim allowlist — what a variant is permitted to assert about Rippling.
#
# WHY THIS FILE EXISTS
# cro/compliance.py maps every comparative or factual assertion in generated copy to
# either (a) a CLM/CAN id in the competitor ledger, or (b) a FACT id here. Anything
# unmappable gets the variant rejected outright. Competitor claims are evidenced by
# the ledger; claims about OURSELVES need their own evidence, and that is this file.
#
# THE DEFAULT IS UNUSABLE
# `verified: false` behaves exactly like an unsourced claim — compliance.py must
# refuse it. This is deliberate: an allowlist that trusts its own unverified entries
# is not an allowlist. Nothing here ships until a human confirms it against a real,
# public, linkable source.
#
# PROVENANCE NOTE (read before Tuesday)
# The competitive-intel agent only ever crawled COMPETITORS, so none of these facts
# came out of the shipped ledgers. Every entry below is seeded from the project brief
# and is therefore UNVERIFIED. Verify against rippling.com and paste the URL into
# `source_url` before relying on any of it. Do not demo a variant whose claims rest
# on an unverified fact — that is precisely the failure mode this file prevents.
#
# SCHEMA
#   id           FACT-xxx, referenced from Variant.claim_refs
#   statement    the assertion, phrased as copy could use it
#   category     pricing | product_scope | coverage | proof | differentiator
#   source_url   public, linkable, first-party. REQUIRED for verified: true
#   source_note  what on that page establishes it
#   verified     false until a human confirms. false = unusable.

facts:
